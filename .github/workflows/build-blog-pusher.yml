name: Build Blog Pusher

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build"
        required: true
        default: "dev"
        type: string
      profile:
        description: "EAS build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check Expo token
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Missing EXPO_TOKEN repository secret."
            exit 1
          fi

      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Prepare isolated build directory
        run: |
          rm -rf /tmp/blog-pusher-build
          mkdir -p /tmp/blog-pusher-build
          rsync -a apps/blog-pusher/ /tmp/blog-pusher-build/
          cd /tmp/blog-pusher-build
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Prepare isolated blog-pusher build"
          pnpm install --lockfile-only --ignore-scripts

      - name: Trigger EAS Android build
        id: eas_build
        working-directory: /tmp/blog-pusher-build
        run: |
          eas build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --no-wait \
            --json > build.json

          echo "Build request submitted:"
          cat build.json

          {
            echo "## Blog Pusher Android Build"
            echo ""
            echo "- Ref: \`${{ inputs.ref }}\`"
            echo "- Profile: \`${{ inputs.profile }}\`"
            echo ""
            echo "```json"
            cat build.json
            echo "```"
          } >> "$GITHUB_STEP_SUMMARY"
