name: Dev Preview (GitHub Pages)

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to preview"
        required: true
        default: "dev"
        type: string
      site:
        description: "Site selection for manual previews"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - changed
          - travel
          - temporal
          - dndiy
          - megameal
      prune_mode:
        description: "Large-asset pruning mode"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - always
          - never

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-dev-preview
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.14.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all sites into subfolders
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
          SITE_INPUT: ${{ inputs.site || 'all' }}
          PRUNE_INPUT: ${{ inputs.prune_mode || 'auto' }}
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          PREVIEW_SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          BASE="/${REPO_NAME}"

          rm -rf preview-dist
          mkdir -p preview-dist
          touch preview-dist/.nojekyll

          travel=false
          temporal=false
          dndiy=false
          megameal=false
          detect_changed=false

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            case "${SITE_INPUT}" in
              all)
                travel=true
                temporal=true
                dndiy=true
                megameal=true
                ;;
              changed)
                detect_changed=true
                ;;
              travel)
                travel=true
                ;;
              temporal)
                temporal=true
                ;;
              dndiy)
                dndiy=true
                ;;
              megameal)
                megameal=true
                ;;
              *)
                echo "Unsupported site input: ${SITE_INPUT}" >&2
                exit 64
                ;;
            esac
          else
            detect_changed=true
          fi

          if [[ "${detect_changed}" == "true" ]]; then
            base_sha="${EVENT_BEFORE}"
            if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
              if git rev-parse HEAD^ >/dev/null 2>&1; then
                base_sha="$(git rev-parse HEAD^)"
              else
                base_sha=""
              fi
            fi

            if [[ -n "${base_sha}" ]]; then
              changed_files="$(git diff --name-only "${base_sha}" "${GITHUB_SHA}" || true)"
            else
              changed_files="$(git show --pretty='' --name-only "${GITHUB_SHA}" || true)"
            fi

            shared=false
            while IFS= read -r file; do
              [[ -z "${file}" ]] && continue
              case "${file}" in
                apps/travel/*) travel=true ;;
                Temporal-Flow/*) temporal=true ;;
                DNDIY.github.io/*) dndiy=true ;;
                apps/megameal/*) megameal=true ;;
              esac
              case "${file}" in
                packages/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.github/workflows/dev-pages-preview.yml)
                  shared=true
                  ;;
              esac
            done <<< "${changed_files}"

            if [[ "${shared}" == "true" ]]; then
              travel=true
              temporal=true
              dndiy=true
              megameal=true
            fi
          fi

          echo "Preview selection:"
          echo "  travel=${travel}"
          echo "  temporal=${temporal}"
          echo "  dndiy=${dndiy}"
          echo "  megameal=${megameal}"

          links_file="$(mktemp)"
          built_count=0
          prune_note=""

          build_site() {
            local key="$1"
            local label="$2"
            local dist_dir="$3"
            local build_script="$4"

            echo "Building ${label}"
            SITE_URL="${PREVIEW_SITE_URL}" SITE_BASE="${BASE}/${key}/" pnpm "${build_script}"
            cp -a "${dist_dir}" "preview-dist/${key}"
            printf '<a href="%s/">%s</a>\n' "${key}" "${label}" >> "${links_file}"
            built_count=$((built_count + 1))
          }

          if [[ "${megameal}" == "true" ]]; then
            build_site "megameal" "MEGA MEAL SAGA" "apps/megameal/dist" "build:megameal"
          fi
          if [[ "${travel}" == "true" ]]; then
            build_site "travel" "Trail Log (Travel)" "apps/travel/dist" "build:travel"
          fi
          if [[ "${dndiy}" == "true" ]]; then
            build_site "dndiy" "DNDIY" "DNDIY.github.io/dist" "build:dndiy"
          fi
          if [[ "${temporal}" == "true" ]]; then
            build_site "temporal" "Temporal Flow" "Temporal-Flow/dist" "build:temporal"
          fi

          prune_mode="${PRUNE_INPUT}"
          if [[ -z "${prune_mode}" ]]; then
            prune_mode="auto"
          fi

          total_before="$(du -sb preview-dist | cut -f1)"
          should_prune=false
          if [[ "${prune_mode}" == "always" ]]; then
            should_prune=true
          elif [[ "${prune_mode}" == "auto" && "${total_before}" -gt 950000000 ]]; then
            should_prune=true
          fi

          if [[ "${should_prune}" == "true" ]]; then
            mapfile -t pruned_files < <(find preview-dist -type f -size +25M -print)
            if [[ "${#pruned_files[@]}" -gt 0 ]]; then
              printf '%s\n' "${pruned_files[@]}" > preview-dist/pruned-large-assets.txt
              find preview-dist -type f -size +25M -delete
              prune_note="Large assets over 25MB were pruned for preview stability. See pruned-large-assets.txt."
              echo "${prune_note}"
            fi
          fi

          total_after="$(du -sb preview-dist | cut -f1)"
          echo "Preview artifact size before pruning: ${total_before} bytes"
          echo "Preview artifact size after pruning:  ${total_after} bytes"

          cat > preview-dist/index.html <<HTMLEOF
          <!DOCTYPE html>
          <html>
          <head><meta charset="utf-8"><title>Merkin Dev Preview</title>
          <style>body{font-family:sans-serif;max-width:600px;margin:4rem auto;padding:0 1rem}a{display:block;margin:1rem 0;font-size:1.2rem}</style>
          </head>
          <body>
          <h1>Merkin Dev Preview</h1>
          <p>Built ${built_count} site(s) for this preview.</p>
          $(if [[ "${built_count}" -eq 0 ]]; then echo '<p>No site changes detected for this commit.</p>'; fi)
          $(cat "${links_file}")
          $(if [[ -n "${prune_note}" ]]; then echo "<p><strong>${prune_note}</strong></p>"; fi)
          </body>
          </html>
          HTMLEOF

          rm -f "${links_file}"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
