<g font-family="sans-serif">
<text x="60" y="68" fill="#57d7ca" font-size="20" letter-spacing="3">AINEKIO / 26 OCTOBER 2026</text>
<text x="60" y="134" fill="#edf6f5" font-size="43" font-weight="700">Targets, speed, measured arrival</text>
<text x="60" y="182" fill="#a5bec4" font-size="24">Freestyle chooses the movement; the P4 executes it.</text>
<rect x="60" y="245" width="340" height="245" rx="14" fill="#102b32" stroke="#37646d"/>
<text x="84" y="286" fill="#ed8c78" font-size="20">01</text>
<text x="84" y="330" fill="#edf6f5" font-size="28" font-weight="700">Generate targets</text>
<text x="84" y="377" fill="#c6d9dc" font-size="22">Joint / foot / body</text>
<text x="84" y="410" fill="#c6d9dc" font-size="22">Requested speed</text>
<text x="84" y="443" fill="#c6d9dc" font-size="22">Explicit holds</text>
<path d="M405 365h20m-7 -7 7 7-7 7" fill="none" stroke="#57d7ca" stroke-width="3"/>
<rect x="430" y="245" width="340" height="245" rx="14" fill="#102b32" stroke="#37646d"/>
<text x="454" y="286" fill="#ed8c78" font-size="20">02</text>
<text x="454" y="330" fill="#edf6f5" font-size="28" font-weight="700">Execute on P4</text>
<text x="454" y="377" fill="#c6d9dc" font-size="22">Ramp toward targets</text>
<text x="454" y="410" fill="#c6d9dc" font-size="22">Read shaft positions</text>
<text x="454" y="443" fill="#c6d9dc" font-size="22">Verify arrival</text>
<path d="M775 365h20m-7 -7 7 7-7 7" fill="none" stroke="#57d7ca" stroke-width="3"/>
<rect x="800" y="245" width="340" height="245" rx="14" fill="#102b32" stroke="#37646d"/>
<text x="824" y="286" fill="#ed8c78" font-size="20">03</text>
<text x="824" y="330" fill="#edf6f5" font-size="28" font-weight="700">Reassess</text>
