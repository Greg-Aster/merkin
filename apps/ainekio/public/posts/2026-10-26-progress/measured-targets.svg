<text x="824" y="410" fill="#c6d9dc" font-size="22">Keep unfinished intent</text>
<text x="824" y="443" fill="#c6d9dc" font-size="22">Choose the next movement</text>
<text x="60" y="558" fill="#a5bec4" font-size="23">Shaft position is measured. Foot contact is not.</text>
<text x="60" y="632" fill="#57d7ca" font-size="19">BUILD JOURNAL · MOTION, MEASUREMENTS AND RESULTS</text>
</g></svg>
