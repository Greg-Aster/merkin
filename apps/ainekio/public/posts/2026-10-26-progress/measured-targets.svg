<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Targets, speed, measured arrival</title>
<desc id="desc">Freestyle chooses the movement; the P4 executes it.. Generate targets: Joint / foot / body; Requested speed; Explicit holds. Execute on P4: Ramp toward targets; Read shaft positions; Verify arrival. Reassess: Fresh joint + IMU data; Keep unfinished intent; Choose the next movement. Shaft position is measured. Foot contact is not.</desc>
