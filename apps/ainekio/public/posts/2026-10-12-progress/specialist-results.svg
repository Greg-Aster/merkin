<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">MetaHuman: specialists with separate jobs</title><desc id="desc">October 12 workflow overview · trained Qwen 0.8B intent and task adapters</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#58d8ce" stroke-width="1.5"/></marker></defs><rect width="1000" height="660" rx="20" fill="#101f26"/><g font-family="sans-serif"><text x="42" y="55" fill="#f0f6f7" font-size="30" font-weight="700">MetaHuman: specialists with separate jobs</text><text x="42" y="90" fill="#a7c3ce" font-size="19">October 12 workflow overview · trained Qwen 0.8B intent and task adapters</text><rect x="40" y="125" width="920" height="115" rx="12" fill="#19333d" stroke="#3b7787"/><text x="60" y="159" fill="#79ece0" font-size="23" font-weight="700">Intent orchestrator · Qwen 0.8B</text><text x="60" y="191" fill="#e1edf1" font-size="19">Read the request; select action, conversation and computer-tool routes.</text><text x="60" y="218" fill="#e1edf1" font-size="19">Choose task and conversation context independently.</text><rect x="40" y="300" width="280" height="135" rx="12" fill="#19333d" stroke="#3b7787"/><text x="60" y="334" fill="#79ece0" font-size="23" font-weight="700">Task specialist</text><text x="60" y="366" fill="#e1edf1" font-size="19">Selected evidence + catalog</text><text x="60" y="393" fill="#e1edf1" font-size="19">Ordered program or</text><text x="60" y="420" fill="#e1edf1" font-size="19">larger-model planning</text><rect x="360" y="300" width="280" height="135" rx="12" fill="#19333d" stroke="#3b7787"/><text x="380" y="334" fill="#79ece0" font-size="23" font-weight="700">Conversation</text><text x="380" y="366" fill="#e1edf1" font-size="19">Its selected context</text><text x="380" y="393" fill="#e1edf1" font-size="19">Acknowledgments and</text><text x="380" y="420" fill="#e1edf1" font-size="19">attributed results</text><rect x="680" y="300" width="280" height="135" rx="12" fill="#19333d" stroke="#3b7787"/><text x="700" y="334" fill="#79ece0" font-size="23" font-weight="700">Computer tools</text><text x="700" y="366" fill="#e1edf1" font-size="19">Existing Terminal service</text><text x="700" y="393" fill="#e1edf1" font-size="19">Finite delegated job</text><text x="700" y="420" fill="#e1edf1" font-size="19">Result returns to chat</text><rect x="40" y="490" width="920" height="85" rx="12" fill="#19333d" stroke="#3b7787"/><text x="60" y="524" fill="#79ece0" font-size="23" font-weight="700">Existing execution and gateway owners</text><text x="60" y="556" fill="#e1edf1" font-size="19">Correlated commands, observations and receipts; P4 retains gait / servo timing.</text><path d="M180 240 V300" fill="none" stroke="#58d8ce" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 240 V300" fill="none" stroke="#58d8ce" stroke-width="3" marker-end="url(#arrow)"/><path d="M820 240 V300" fill="none" stroke="#58d8ce" stroke-width="3" marker-end="url(#arrow)"/><path d="M180 435 V490" fill="none" stroke="#58d8ce" stroke-width="3" marker-end="url(#arrow)"/><text x="42" y="615" fill="#bcced6" font-size="19">Training and format validity do not establish correct planning or physical acceptance.</text></g></svg>