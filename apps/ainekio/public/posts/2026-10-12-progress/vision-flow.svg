<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">YOLOE: one camera, two rates of work</title><desc id="desc">October 12 source diagram · desktop integration in progress</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#58d8ce" stroke-width="1.5"/></marker></defs><rect width="1000" height="660" rx="20" fill="#101f26"/><g font-family="sans-serif"><text x="42" y="55" fill="#f0f6f7" font-size="30" font-weight="700">YOLOE: one camera, two rates of work</text><text x="42" y="90" fill="#a7c3ce" font-size="19">October 12 source diagram · desktop integration in progress</text><rect x="40" y="125" width="275" height="120" rx="12" fill="#19333d" stroke="#3b7787"/><text x="60" y="159" fill="#79ece0" font-size="23" font-weight="700">P4 camera</text><text x="60" y="191" fill="#e1edf1" font-size="19">JPEG + frame identity</text><text x="60" y="218" fill="#e1edf1" font-size="19">Physical capture</text><rect x="370" y="125" width="590" height="120" rx="12" fill="#19333d" stroke="#3b7787"/><text x="390" y="159" fill="#79ece0" font-size="23" font-weight="700">Gateway camera worker</text><text x="390" y="191" fill="#e1edf1" font-size="19">YOLOE search / selection + ByteTrack continuity</text><text x="390" y="218" fill="#e1edf1" font-size="19">Accepted observations retain query and track IDs</text><rect x="40" y="310" width="410" height="125" rx="12" fill="#19333d" stroke="#3b7787"/><text x="60" y="344" fill="#79ece0" font-size="23" font-weight="700">Body Control</text><text x="60" y="376" fill="#e1edf1" font-size="19">Boxes on their exact source image</text><text x="60" y="403" fill="#e1edf1" font-size="19">Search, select and release controls</text><rect x="510" y="310" width="450" height="125" rx="12" fill="#19333d" stroke="#3b7787"/><text x="530" y="344" fill="#79ece0" font-size="23" font-weight="700">MetaHuman</text><text x="530" y="376" fill="#e1edf1" font-size="19">Fresh recognition + retained references</text><text x="530" y="403" fill="#e1edf1" font-size="19">Slower vision reasoning via Model Router</text><rect x="250" y="490" width="550" height="85" rx="12" fill="#19333d" stroke="#3b7787"/><text x="270" y="524" fill="#79ece0" font-size="23" font-weight="700">Existing task → gateway → body</text><text x="270" y="556" fill="#e1edf1" font-size="19">Movement remains a separate admitted operation</text><path d="M315 185 H370" fill="none" stroke="#58d8ce" stroke-width="3" marker-end="url(#arrow)"/><path d="M540 245 V275 H245 V310" fill="none" stroke="#58d8ce" stroke-width="3" marker-end="url(#arrow)"/><path d="M780 245 V310" fill="none" stroke="#58d8ce" stroke-width="3" marker-end="url(#arrow)"/><path d="M735 435 V465 H650 V490" fill="none" stroke="#58d8ce" stroke-width="3" marker-end="url(#arrow)"/><text x="42" y="615" fill="#bcced6" font-size="19">Observed: stationary chair tracking. Still open: sustained streams and physical following.</text></g></svg>