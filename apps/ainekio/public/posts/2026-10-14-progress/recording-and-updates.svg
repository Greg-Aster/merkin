<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Camera, recording and maintenance</title><desc id="desc">V2 / P4 · October 13–14 development record</desc><rect width="1000" height="640" rx="20" fill="#101f26"/><g font-family="sans-serif"><text x="40" y="57" fill="#f0f6f7" font-size="30" font-weight="700">Camera, recording and maintenance</text><text x="40" y="94" fill="#a7c3ce" font-size="19">V2 / P4 · October 13–14 development record</text>
<rect x="40" y="125" width="920" height="120" rx="12" fill="#19333d" stroke="#3b7787"/><text x="62" y="159" fill="#79ece0" font-size="24" font-weight="700">One camera, one JPEG encoding</text><text x="62" y="194" fill="#e1edf1" font-size="21">Preview → gateway and MetaHuman. The same JPEGs → SD video.</text><text x="62" y="224" fill="#e1edf1" font-size="21">Body Control: start / stop recording, list clips, download a selected clip.</text>
<rect x="40" y="265" width="920" height="120" rx="12" fill="#19333d" stroke="#3b7787"/><text x="62" y="299" fill="#79ece0" font-size="24" font-weight="700">Firmware upload → validation → explicit activation</text><text x="62" y="334" fill="#e1edf1" font-size="21">Write the inactive P4 application slot; show progress on the screen.</text><text x="62" y="364" fill="#e1edf1" font-size="21">Choose next boot or restart. C6 firmware remains a separate operation.</text>
<rect x="40" y="405" width="920" height="120" rx="12" fill="#19333d" stroke="#3b7787"/><text x="62" y="439" fill="#79ece0" font-size="24" font-weight="700">Recorded 0.8.37 controller test</text><text x="62" y="474" fill="#e1edf1" font-size="21">469 seconds · 411 recorded frames · 8 finalized segments.</text><text x="62" y="504" fill="#e1edf1" font-size="21">No reconnects in that window; downloaded video decoded successfully.</text>
<text x="40" y="594" fill="#bcced6" font-size="19">Short controller test · no loaded gait or long endurance qualification.</text></g></svg>
