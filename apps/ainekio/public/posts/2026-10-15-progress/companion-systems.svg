<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">Ainekio companion systems</title><desc id="desc">Requests, body events and autonomous intentions inform Environment routing. Task and Vision select actions; the body returns evidence for review and Persona supplies the outward reply. Attributed experience informs later Desire review.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#94a3b8" stroke-width="2"/></marker></defs>
<rect width="1000" height="660" rx="24" fill="#111827"/>
<g font-family="system-ui,sans-serif" fill="#f3f4f6"><text x="48" y="58" font-size="29" font-weight="700">One companion, connected responsibilities</text><text x="48" y="91" fill="#cbd5e1" font-size="19">October 15, 2026 · Information flow, not a fixed activity script</text>
<g fill="#1e293b" stroke="#64748b" stroke-width="2"><rect x="48" y="128" width="904" height="70" rx="12"/><rect x="48" y="248" width="272" height="96" rx="12"/><rect x="364" y="248" width="272" height="96" rx="12"/><rect x="680" y="248" width="272" height="96" rx="12"/><rect x="364" y="397" width="272" height="96" rx="12"/><rect x="680" y="397" width="272" height="96" rx="12"/><rect x="48" y="397" width="272" height="96" rx="12"/></g>
<g text-anchor="middle" font-size="22"><text x="500" y="171">Requests · Body Event Trigger · Active Operator</text><text x="184" y="285" font-weight="700">Orchestrator</text><text x="184" y="317" font-size="18" fill="#cbd5e1">Routes and selected context</text><text x="500" y="285" font-weight="700">Task / Planner / Vision</text><text x="500" y="317" font-size="18" fill="#cbd5e1">Choose supported actions</text><text x="816" y="285" font-weight="700">Body Control + robot</text><text x="816" y="317" font-size="18" fill="#cbd5e1">Execute and report results</text><text x="816" y="434" font-weight="700">Goal Review</text><text x="816" y="466" font-size="18" fill="#cbd5e1">Assess actual evidence</text><text x="500" y="434" font-weight="700">Persona</text><text x="500" y="466" font-size="18" fill="#cbd5e1">Generate the outward reply</text><text x="184" y="434" font-weight="700">Attributed experience</text><text x="184" y="466" font-size="18" fill="#cbd5e1">Memory and later review</text></g>
<g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M184 198V238"/><path d="M320 296H354"/><path d="M636 296H670"/><path d="M816 344V387"/><path d="M680 445H646"/><path d="M364 445H330"/></g>
<text x="48" y="550" font-size="22" fill="#6ee7b7" font-weight="700">Desire review connects aspirations to specific outcomes.</text><text x="48" y="585" font-size="19" fill="#cbd5e1">It can consider standing goals, memory, current status and recorded task results.</text><text x="48" y="618" font-size="19" fill="#cbd5e1">A command receipt alone does not prove the real-world objective succeeded.</text></g></svg>