name = "merkin-edge-router"
main = "src/index.ts"
compatibility_date = "2026-04-08"

# These origins should be the deploy targets behind the public domain.
# MAIN_SITE_ORIGIN should point at the main MEGAMEAL site origin.
# GAME_SITE_ORIGIN should point at the separately hosted game origin.
[vars]
MAIN_SITE_ORIGIN = "https://megameal-main.pages.dev"
GAME_SITE_ORIGIN = "https://megameal-game.pages.dev"

# Keep the /game prefix by default so a game build served under /game
# can proxy through cleanly. Set to "true" only if the game origin serves
# the game from its own root and you want /game/* rewritten to /* upstream.
GAME_STRIP_PREFIX = "false"
GAME_PREFIX = "/game"

